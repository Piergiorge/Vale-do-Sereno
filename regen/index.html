  html, body { margin: 0; height: 100%; background: #0c120c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: monospace;
    background: radial-gradient(ellipse at 50% 40%, #1c2a1c 0%, #0a100a 70%); }
  #mon { position: relative; }
  .bezel { background: linear-gradient(180deg, #5f6b4f 0%, #4f5b41 60%, #414b35 100%); border-radius: 22px;
    padding: 4.5% 5% 2% 5%; box-shadow: 0 18px 40px rgba(0,0,0,.6), inset 0 2px 0 #7d8a6a, inset 0 -3px 0 #2c3424; }
  .screen { position: relative; border-radius: 16px / 12px; overflow: hidden; background: #000;
    box-shadow: 0 0 0 4px #5a5446, 0 0 0 7px #2b2820, inset 0 0 40px rgba(0,0,0,.8); }
  #scr { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges;
    filter: saturate(1.15) contrast(1.05); touch-action: none; }
  @media (pointer: fine) { #scr { cursor: none; } }
  .scan { position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.22) 0px, rgba(0,0,0,.22) 1px, transparent 1px, transparent 3px); }
  .glare { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 30% 15%, rgba(255,255,255,.08) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(0,0,0,.45) 100%);
    animation: flick 0.12s infinite; }
  @keyframes flick { 0% { opacity: .97 } 50% { opacity: 1 } 100% { opacity: .98 } }
  @media (max-width: 600px) {
    .bezel { padding: 3% 3% 1.5% 3%; border-radius: 14px; }
    .screen { border-radius: 6px; }
    .panel { font-size: 9px; letter-spacing: 1px; padding-top: 6px; }
  }
  .panel { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px 2px;
    color: #c8d0a8; font: bold 12px monospace; letter-spacing: 3px; }
  .led { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3cf05a; box-shadow: 0 0 6px #3cf05a; margin-left: 8px; }
  .vents { width: 30%; height: 8px; background: repeating-linear-gradient(90deg, #2c3424 0 3px, transparent 3px 7px); border-radius: 2px; }
</style>
</head>

  };
  // bitmap 5x11 de um caractere
  const BM = {};
  function bitmap(ch) {
    if (BM[ch]) return BM[ch];
    const grid = Array.from({ length: 11 }, () => '.....'.split(''));
    const put = (rows, r0) => rows.forEach((row, i) => { for (let x = 0; x < 5; x++) if (row[x] === '#' && r0 + i >= 0 && r0 + i < 11) grid[r0 + i][x] = '#'; });
    if (COMP[ch]) {
      const [b, a] = COMP[ch], up = b === b.toUpperCase() && b !== 'ı';
      put(G[b], 2);
      if (a === 'ced') put(ACC.ced, 9); else put(ACC[a], up ? 0 : 1);
    } else put(G[ch] || G['?'], 2);
    return (BM[ch] = grid.map(r => r.join('')));
  }
  // cache de glifos por cor
  const GC = new Map();
  function glyph(ch, col) {
    const k = col + ch;
    let c = GC.get(k);
    if (c) return c;
    c = document.createElement('canvas'); c.width = 5; c.height = 11;
    const g = c.getContext('2d'); g.fillStyle = col;
    bitmap(ch).forEach((row, y) => { for (let x = 0; x < 5; x++) if (row[x] === '#') g.fillRect(x, y, 1, 1); });
    GC.set(k, c);
    return c;
  }
  function text(g, s, x, y, col = '#000', sc = 1) {
    s = String(s);
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (ch !== ' ') g.drawImage(glyph(ch, col), Math.round(x + i * CW * sc), Math.round(y), 5 * sc, 11 * sc);
    }
  }
  const tw = s => String(s).length * CW;
  function textC(g, s, cx, y, col, sc = 1) { text(g, s, Math.round(cx - String(s).length * CW * sc / 2 + sc / 2), y, col, sc); }
  // quebra em linhas de no máximo n caracteres
  function wrap(s, n) {
    const out = [];
    for (const para of String(s).split('\n')) {
      if (!para.length) { out.push(''); continue; }
      let line = '';
      for (const w of para.split(' ')) {
        if (!line.length) line = w;
        else if ((line + ' ' + w).length <= n) line += ' ' + w;
        else { out.push(line); line = w; }
        while (line.length > n) { out.push(line.slice(0, n)); line = line.slice(n); }
      }
      out.push(line);
    }
    return out;

  };

  };
  UP.cerca = { n: 'Cerca contra o gado', c: 700, d: 'O gado solto não entra mais na área.' };
  const UP_ORDER = ['luvas', 'adubo', 'aceiro', 'cerca', 'viveiro', 'mutirao', 'escola', 'sombrite', 'banco'];
  const STAGES = ['Solo queimado', 'Campo sujo', 'Capoeira', 'Mata secundária', 'Mata madura'];
  const DIARY = {
    inicio: 'A área queimou na noite seca. Sem ajuda, a braquiária (capim africano) toma conta e o fogo volta todo ano. Restaurar é acelerar a sucessão ecológica: a troca gradual de espécies até a mata se fechar.',
    guandu: PL.guandu.d, embauba: PL.embauba.d, eucalipto: PL.eucalipto.d, inga: PL.inga.d, ipe: PL.ipe.d, jequitiba: PL.jequitiba.d, jucara: PL.jucara.d,
    poleiro: FA.poleiro.d, abrigo: FA.abrigo.d, ninho: FA.ninho.d, corredor: FA.corredor.d,

    fogo: 'O fogo voltou pela braquiária seca. Ele mata primeiro as mudas e as pioneiras. O aceiro, uma faixa limpa em volta, impede a entrada do fogo.',
    morte: 'Mudas morreram por não estarem na luz certa. Pioneiras precisam de sol; espécies de mata madura precisam de sombra. Cada grupo prepara o terreno para o seguinte.',
    sombra: 'As pioneiras começaram a morrer na sombra que elas mesmas criaram. Faz parte da sucessão: viram adubo e liberam espaço para as secundárias.',

    diversidade: 'Diversidade: o jogo usa o índice de Shannon (H), que cresce com o número de espécies e com o equilíbrio entre elas. Mais diversidade, mais produção.',
    madeira: 'Madeireiros ilegais: árvores grandes como ipê e jequitibá levam décadas, às vezes séculos, para crescer. Uma noite de motosserra apaga isso. Denunciar à Polícia Ambiental é o caminho.',
    palmito: 'O palmito-juçara só tem um caule: cortar o palmito mata a palmeira. Sem juçara, tucanos e jacutingas perdem o principal alimento do inverno.',
    gado: 'Gado solto pisoteia e come as mudas e compacta o solo. Cercar a área é uma das primeiras medidas de qualquer restauração.',
    erosao: 'Erosão: na encosta, a chuva forte leva a camada fértil do solo quando o chão está descoberto. Raízes e folhas no chão seguram a terra.',
    enchente: 'Mata ciliar: as plantas da beira do rio seguram o barranco e filtram a água. Espécies de beira de rio, como o ingá, aguentam as cheias.',
    pesquisa: 'Pesquisadores contam espécies em parcelas fixas, ano após ano. É assim que se sabe se uma restauração está funcionando.',
    s1: 'Campo sujo: o guandu cobriu o chão e começou a adubar o solo.', s2: 'Capoeira: as pioneiras fazem a primeira sombra e trazem os dispersores.',
    s3: 'Mata secundária: a copa fechou, o solo está rico e a braquiária sumiu na sombra.', s4: 'Mata madura: espécies de sombra, fauna grande e alta diversidade. A área está restaurada!'
  };

  // ---------------- estado ----------------
  const fresh = (area = 0, restored = 0, diary = {}) => ({
    seeds: 50 * restored, total: 0, pl: {}, fa: {}, up: {}, solo: AREA_DEF[area % AREA_DEF.length].solo0, intro: -1, stage: 0, area, restored, tufts: [], diary: Object.assign({ inicio: 1 }, diary), t: Date.now(), fireT: 0, mutT: 0, braqT: 0, clicks: 0
  });
  let GS = fresh();
  try { const s = JSON.parse(localStorage.getItem('regen-v1') || 'null'); if (s) GS = Object.assign(fresh(), s); } catch (e) {}
  const save = () => { GS.t = Date.now(); try { localStorage.setItem('regen-v1', JSON.stringify(GS)); } catch (e) {} };
  S.msgs = []; S.parts = []; S.tab = 'pl'; S.mult = 1; S.newDiary = null;

  const cnt = k => GS.pl[k] || 0;
  const cap = () => areaCap(GS.area);
  const costOf = (base, cm, n, k = 1) => { let c = 0; for (let i = 0; i < k; i++) c += base * Math.pow(cm, n + i); return Math.ceil(c); };
  function cover() { let s = 0; for (const k of PL_ORDER) s += cnt(k) * PL[k].w; return Math.min(98, s / cap() * 100); }
  const luz = () => 100 - cover();
  function shannon() {
    const xs = PL_ORDER.filter(k => !PL[k].exotic).map(cnt).filter(x => x > 0), N = xs.reduce((a, b) => a + b, 0);
    if (!N) return 0;
    return -xs.reduce((s, x) => s + (x / N) * Math.log(x / N), 0) * (1 - Math.min(.6, cnt('eucalipto') / Math.max(1, N + cnt('eucalipto'))));
  }
  const foodOf = k => (PL[k].food || 0) * ((AD().foodMul || {})[k] || 1);
  function food(a) { return AN[a].diet.reduce((s, k) => s + cnt(k) * foodOf(k), 0); }
  const pc0 = k => PL[k].c0 * ((AD().cheap || {})[k] || 1);
  function fauna() {
    const capA = {}; for (const k of FA_ORDER) for (const [a, n] of Object.entries(FA[k].give)) capA[a] = (capA[a] || 0) + n * (GS.fa[k] || 0);
    const out = {};
    for (const a in AN) { const c = capA[a] || 0, f = Math.floor(food(a) / AN[a].need); out[a] = { cap: c, n: Math.min(c, f), hungry: c > f }; }
    return out;
  }
  const prestigeMult = () => 1 + .5 * GS.restored;
  function rates() {
    const F = fauna(), H = shannon(), braq = Math.max(.3, 1 - .045 * GS.tufts.length), up = (GS.up.banco ? 2 : 1) * prestigeMult();
    let anim = 0; for (const a in AN) anim += F[a].n * AN[a].rate;
    let plant = 0; for (const k of PL_ORDER) plant += cnt(k) * ((PL[k].seed || 0) + (PL[k].wind || 0));
    const total = (anim + plant) * (1 + H * .35) * braq * up;
    return { total, anim, plant, H, braq, F };
  }
  const clickPow = () => Math.max(1, (1 + rates().total * .03) * (GS.up.luvas ? 2 : 1) * (GS.up.escola ? 3 : 1));
  const survival = (k) => { const p = PL[k], L = luz(); return (L >= p.luz[0] && L <= p.luz[1] && GS.solo >= p.solo) ? 1 : (GS.up.sombrite ? .7 : GS.up.viveiro ? .45 : .2); };
  const unlocked = st => GS.stage >= st;

  function note(t, c = P.lg) { S.msgs.unshift({ t, c, at: S.t }); if (S.msgs.length > 4) S.msgs.pop(); }
  function diary(k) { if (!GS.diary[k]) { GS.diary[k] = 1; S.newDiary = { k, at: S.t }; sfx.open(); } }
  function addSeeds(n) { GS.seeds += n; GS.total += n; }

  function buyPlant(k, n) {
    const p = PL[k], c = costOf(pc0(k), p.cm, cnt(k), n);
    if (GS.seeds < c || !unlocked(p.st)) { sfx.err(); return; }
    GS.seeds -= c;
    const sv = survival(k); let ok = 0; for (let i = 0; i < n; i++) if (Math.random() < sv) ok++;
    GS.pl[k] = cnt(k) + ok; diary(k === 'aroeira' ? 'embauba' : k);
    if (ok < n) {
      const L = luz(), why = L < p.luz[0] ? `sombra demais (pega com luz de ${p.luz[0]}% a ${p.luz[1]}%)` : L > p.luz[1] ? `sol demais (precisa de luz até ${p.luz[1]}%)` : `solo pobre (precisa de ${p.solo})`;
      note(`${n - ok} de ${n} mudas de ${p.n.toLowerCase()} morreram: ${why}.`, P.lo); diary('morte'); sfx.err();
    } else { note(`+${n} ${p.n.toLowerCase()}`); sfx.send(); }
  }
  function buyFa(k, n) {
    const f = FA[k], c = costOf(f.c0, f.cm, GS.fa[k] || 0, n);
    if (GS.seeds < c || !unlocked(f.st)) { sfx.err(); return; }
    GS.seeds -= c; GS.fa[k] = (GS.fa[k] || 0) + n; diary(k); sfx.send();
    const F = fauna(), hung = Object.keys(f.give).filter(a => F[a].hungry);
    if (hung.length && S.t - (S.lastFome || -99) > 45) {
      S.lastFome = S.t; const a = hung[0];
      note(`Sobrou abrigo: ${AN[a].n.toLowerCase()} só ficam se tiver comida. Plante ${AN[a].diet.map(k => PL[k].short).join(', ')}.`, P.lo); diary('fome');
    }
  }
  function buyUp(k) { const u = UP[k]; if (GS.up[k] || GS.seeds < u.c || (u.req && !GS.up[u.req])) { sfx.err(); return; } GS.seeds -= u.c; GS.up[k] = 1; note(u.n + ' pronto.'); sfx.good(); }
  function cutEuc() { const n = cnt('eucalipto'); if (!n) return; GS.pl.eucalipto = 0; addSeeds(Math.round(costOf(PL.eucalipto.c0, 1, 0, n) * .5)); note(`${n} eucaliptos cortados. A madeira virou sementes nativas.`, P.y); sfx.send(); }

  // ---------------- regras do estágio ----------------
  function reqs() {
    const F = fauna(), types = Object.values(F).filter(f => f.n > 0).length, H = shannon();
    return [
      [['5 feijões-guandu', cnt('guandu') >= 5]],
      [['10 pioneiras nativas (embaúba, aroeira)', cnt('embauba') + cnt('aroeira') >= 10], ['solo 25', GS.solo >= 25]],
      [['cobertura 55%', cover() >= 55], ['10 ingás ou ipês', cnt('inga') + cnt('ipe') >= 10], ['solo 50', GS.solo >= 50]],
      [['4 jequitibás', cnt('jequitiba') >= 4], ['8 palmitos-juçara', cnt('jucara') >= 8], ['4 tipos de fauna', types >= 4], ['diversidade H 1,25', H >= 1.25], ['nenhum eucalipto', cnt('eucalipto') === 0]]
    ];
  }
  function checkStage() {
    if (GS.stage >= 4) return;
    const r = reqs()[GS.stage];
    if (r.every(x => x[1])) { GS.stage++; diary('s' + GS.stage); note('Nova fase: ' + STAGES[GS.stage] + '!', P.y); sfx.good(); if (GS.stage >= 2) diary('diversidade'); }
  }
  function restore() {
    const d = GS.diary, a = GS.area + 1, r = GS.restored + 1;
    GS = fresh(a, r, d); S.msgs = []; S.ev = null; note(`Nova área: ${AD().n}. Produção ×${prestigeMult().toFixed(1)}.`, P.y); save(); introArea();
  }

  // ---------------- eventos ----------------
  // invasores: aparecem na cena e precisam ser clicados antes do tempo acabar
  const EV = {
    madeireiro: { intr: 2, spr: 'logger', cond: () => cnt('jequitiba') + cnt('ipe') + cnt('inga') >= 3,
      t: 'MADEIREIROS ILEGAIS! Clique neles para chamar a Polícia Ambiental.', win: 'A Polícia Ambiental, avisada pela Torre 3, apreendeu a motosserra.',
      dmg: f => { const lost = cut('jequitiba', .5 * f) + cut('ipe', .4 * f) + cut('inga', .3 * f); return `Os madeireiros derrubaram ${lost} árvores grandes.`; }, dia: 'madeira' },
    palmiteiro: { intr: 2, spr: 'palm', cond: () => cnt('jucara') >= 3,
      t: 'PALMITEIROS! Vão cortar o palmito-juçara. Clique neles.', win: 'Os palmiteiros fugiram sem levar nada.',
      dmg: f => `Os palmiteiros cortaram ${cut('jucara', .5 * f)} palmitos-juçara.`, dia: 'palmito' },
    gado: { intr: 3, spr: 'cow', cond: () => !GS.up.cerca && cnt('guandu') + cnt('embauba') + cnt('aroeira') + cnt('inga') >= 4,
      t: 'GADO SOLTO comendo as mudas! Clique nos bois para espantar.', win: 'O gado voltou para o pasto do vizinho.',
      dmg: f => { const lost = cut('guandu', .4 * f) + cut('embauba', .2 * f) + cut('aroeira', .2 * f) + cut('inga', .1 * f); return `O gado comeu e pisoteou ${lost} mudas. A cerca resolve isso.`; }, dia: 'gado' },
    erosao: { cond: () => true, run: () => { if (cover() < 40) { GS.solo = Math.max(0, GS.solo - 12); return ['Chuva forte na encosta: sem cobertura, a enxurrada levou parte do solo.', P.lo]; } return ['Chuva forte, mas as plantas seguraram o solo da encosta.', P.lg]; }, dia: 'erosao' },
    enchente: { cond: () => cnt('guandu') + cnt('embauba') + cnt('aroeira') > 0, run: () => { const lost = cut('guandu', .4) + cut('embauba', .15) + cut('aroeira', .15); return [`Cheia do rio! Arrastou ${lost} mudas baixas. O ingá, de beira de rio, aguentou.`, P.lo]; }, dia: 'enchente' },
    chuva: { cond: () => true, run: () => { GS.solo = Math.min(100, GS.solo + 4); return ['Chuva mansa: o solo agradece (+4).', P.lb]; } },
    pesquisa: { cond: () => GS.stage >= 1, run: () => { const n = Math.max(60, rates().total * 40); addSeeds(n); return [`Pesquisadores da universidade contaram as espécies e deixaram ${fmt(n)} sementes do banco de sementes.`, P.lg]; }, dia: 'pesquisa' },
    mutirao: { cond: () => true, run: () => { const n = Math.max(100, rates().total * 60); addSeeds(n); return [`Mutirão da escola da Vila: as crianças coletaram ${fmt(n)} sementes!`, P.lg]; } }
  };
  function cut(k, f) { const n = cnt(k), lost = Math.min(n, Math.ceil(n * f)); if (f > 0 && n) GS.pl[k] = n - lost; return f > 0 && n ? lost : 0; }
  S.ev = null; S.evClock = 0; S.evNext = 70;
  function startEvent() {
    const list = AD().ev.filter(k => EV[k].cond());
    if (!list.length) return;
    const k = list[Math.floor(Math.random() * list.length)], E = EV[k];
    if (E.intr) {
      const who = [];
      for (let i = 0; i < E.intr; i++) { const left = Math.random() < .5; who.push({ x: left ? 6 + i * 10 : 314 - i * 10, dx: left ? 6 : -6, alive: true }); }
      S.ev = { k, t0: S.t, dur: 16, who }; note(E.t, P.r); sfx.alert();
    } else { const [m, c] = E.run(); note(m, c); (c === P.lo ? sfx.bad : sfx.open)(); }
    if (E.dia) diary(E.dia);
  }
  function tickEvent(dt) {
    if (S.ev) {
      const E = EV[S.ev.k];
      S.ev.who.forEach(w => { if (w.alive) w.x = Math.max(6, Math.min(314, w.x + w.dx * dt)); });
      const left = S.ev.who.filter(w => w.alive).length;
      if (!left) { note(E.win, P.lg); sfx.good(); S.ev = null; }
      else if (S.t - S.ev.t0 > S.ev.dur) { note(E.dmg(left / S.ev.who.length), P.r); sfx.bad(); S.ev = null; }
      return;
    }

    if (S.evClock > S.evNext && GS.stage >= 1) { S.evClock = 0; S.evNext = 70 + Math.random() * 80; startEvent(); }
  }
  function introArea() {
    if (GS.intro === GS.area) return;
    GS.intro = GS.area; const A = AD();
    modal(`${A.n.toUpperCase()}\n\n${A.d}\n\n${A.mods}`, [['PLANTAR', () => { S.modal = null; }]]);
  }

  // ---------------- simulação ----------------
  function tick(dt) {
    const R0 = rates();
    addSeeds(R0.total * dt);
    // solo: leguminosas e serrapilheira
    let tot = 0; for (const k of PL_ORDER) tot += cnt(k);
    const ds = (cnt('guandu') * PL.guandu.soil + cnt('inga') * PL.inga.soil + tot * .0015) * (GS.up.adubo ? 2 : 1) * AD().soil * (1 - GS.solo / 100);
    GS.solo = Math.min(100, GS.solo + ds * dt);
    // pioneiras morrem na sombra
    const L = luz();
    for (const k of ['guandu', 'embauba', 'aroeira']) {
      const p = PL[k]; if (cnt(k) > 0 && L < p.luz[0] - 8) { GS['die_' + k] = (GS['die_' + k] || 0) + cnt(k) * .02 * dt; if (GS['die_' + k] >= 1) { const n = Math.floor(GS['die_' + k]); GS['die_' + k] -= n; GS.pl[k] = Math.max(0, cnt(k) - n); GS.solo = Math.min(100, GS.solo + n * .3); diary('sombra'); } }
    }
    // braquiária: aparece no sol, some na sombra
    GS.braqT += dt;
    if (L > 50 && GS.braqT > (9 - (L - 50) / 10) / AD().braq && GS.tufts.length < 14) { GS.braqT = 0; GS.tufts.push({ x: 10 + Math.floor(Math.random() * 290), s: 0 }); diary('braq'); }
    if (L < 40 && GS.braqT > 6 && GS.tufts.length) { GS.braqT = 0; GS.tufts.pop(); }
    GS.tufts.forEach(t => t.s = Math.min(1, t.s + dt / 20));
    if (GS.up.mutirao) { GS.mutT += dt; if (GS.mutT > 8 && GS.tufts.length) { GS.mutT = 0; GS.tufts.shift(); } }
    // fogo
    GS.fireT += dt;
    if (GS.tufts.length >= 8 && !GS.up.aceiro && GS.fireT > 30 && Math.random() < .006 * dt * 10 * AD().fire) {
      GS.fireT = 0; S.fire = S.t;
      for (const k of PL_ORDER) { const loss = ['guandu', 'embauba', 'aroeira', 'eucalipto'].includes(k) ? .4 : .2; GS.pl[k] = Math.round(cnt(k) * (1 - loss)); }
      GS.tufts = []; GS.solo = Math.max(0, GS.solo - 8); note('FOGO! A braquiária seca queimou parte das mudas.', P.r); diary('fogo'); sfx.bad();
    }
    checkStage();
    tickEvent(dt);
  }
  // progresso enquanto o jogo esteve fechado (metade da produção, até 8 h)
  (function offline() {
    const dt = Math.min(8 * 3600, (Date.now() - (GS.t || Date.now())) / 1000);
    if (dt > 60) { const g = rates().total * dt * .5; if (g >= 1) { addSeeds(g); S.offline = { dt, g }; } }
  })();

  // ---------------- números ----------------
  function fmt(n) {
    if (n < 10 && n % 1) return n.toFixed(1).replace('.', ',');
    if (n < 1000) return String(Math.floor(n));
    const u = [[1e12, 'tri'], [1e9, 'bi'], [1e6, 'mi'], [1e3, 'mil']];
    for (const [v, s] of u) if (n >= v) return (n / v).toFixed(n / v < 10 ? 2 : n / v < 100 ? 1 : 0).replace('.', ',') + ' ' + s;
  }

  // ---------------- desenho da cena ----------------
  function gy(x) { const L = AD().look; return L === 'encosta' ? GROUND - 14 + Math.round(x * .044) : GROUND; }
  const pos = (k, i) => { const h = hsh(k.length * 13 + i, k.charCodeAt(0)); return 8 + Math.floor(h * 304); };
  const SPR2 = {
    guandu(x, y) { R(g, x - 3, y - 6, 7, 6, '#4a8a2a'); R(g, x - 2, y - 7, 5, 2, '#5aa03a'); R(g, x - 1, y - 5, 1, 1, P.y); R(g, x + 2, y - 3, 1, 1, P.y); },
    embauba(x, y, t) { R(g, x, y - 30, 1, 30, '#c8c8b8'); const sw = Math.round(Math.sin(t + x) * .6); for (let i = 0; i < 4; i++) R(g, x - 7 + i * 2 + sw, y - 31 - i, 15 - i * 4, 2, i % 2 ? '#a8c8a0' : '#88a880'); R(g, x - 2, y - 26, 1, 4, '#a8b890'); },
    aroeira(x, y) { R(g, x, y - 14, 2, 14, '#5a4030'); blob(g, x + 1, y - 17, 6, 5, '#2a6a2a'); [[-3, -18], [2, -15], [4, -19], [-1, -14]].forEach(([a, b]) => R(g, x + a, y + b, 1, 1, P.r)); },
    eucalipto(x, y) { R(g, x, y - 44, 2, 44, '#c8c0b0'); R(g, x - 3, y - 50, 8, 18, '#7a9a8a'); dith(g, x - 3, y - 50, 8, 18, '#5a7a6a'); },

    ['Sementes/s', 'sps', () => `A moeda do jogo. Vêm dos animais dispersores (a maior parte), das sementes que o vento leva (ipê, jequitibá) e do guandu. São multiplicadas pela diversidade (H), pelo capim e pelas áreas já restauradas. O clique rende 3% da produção por segundo.\n\nAgora: ${fmt(rates().total)} por segundo.`],
    ['Sucessão', 'suc', () => 'A troca gradual de espécies num lugar perturbado (queimado, desmatado) até a mata se refazer: Solo queimado → Campo sujo → Capoeira → Mata secundária → Mata madura. Cada grupo de espécies muda as condições (luz, solo, umidade) e prepara o terreno para o grupo seguinte.'],
    ['Pioneira', 'pio', () => 'Planta de crescimento rápido e vida curta, que aguenta sol forte e solo pobre: embaúba, aroeira. É a primeira a chegar e faz a primeira sombra. Morre quando a mata se fecha.'],
    ['Secundária', 'sec', () => 'Espécies que chegam depois das pioneiras e precisam de meia-sombra e de solo melhor: ingá (secundária inicial), ipê (secundária tardia). Formam o corpo da mata secundária.'],
    ['Clímax', 'cli', () => 'Espécies da mata madura, que só se estabelecem na sombra: jequitibá-rosa (árvore emergente, acima do dossel) e palmito-juçara (sub-bosque). Crescem devagar e vivem muito.'],
    ['Fixação de N', 'fix', () => 'Leguminosas como o feijão-guandu e o ingá têm nódulos nas raízes com bactérias (rizóbios) que transformam o nitrogênio do ar em adubo. Por isso o guandu é usado como "adubo verde" na restauração.'],
    ['Dispersão', 'disp', () => 'Como as sementes chegam longe da planta-mãe. Zoocoria: por animais que comem os frutos (sabiás, morcegos, tucanos, antas). Anemocoria: pelo vento, com sementes aladas (ipê, jequitibá). Na Mata Atlântica, a maioria das árvores depende de animais.'],
    ['Nucleação', 'nuc', () => 'Técnica de restauração que cria pequenos "núcleos" que atraem vida, em vez de plantar tudo: poleiros artificiais para as aves, abrigos para morcegos, montes de galhos. As sementes que os animais trazem começam a mata em volta deles.'],
    ['Capacidade de suporte', 'cap', () => 'O número máximo de indivíduos que um ambiente sustenta. No jogo, cada estrutura abre vagas, mas só fica o animal que tem comida: com abrigo e sem as plantas certas, a vaga fica vazia ("FALTA COMIDA").'],
    ['Exótica/invasora', 'exo', () => 'Exótica: veio de outra região (eucalipto da Austrália, braquiária da África). Invasora: exótica que se espalha sozinha e prejudica as nativas, como a braquiária. Exótica não alimenta a fauna nativa e não conta para a diversidade.'],
    ['Aceiro', 'ace', () => 'Faixa de terra limpa, sem capim, em volta de uma área. O fogo não tem o que queimar e para ali.'],
    ['Corredor', 'cor', () => 'Faixa de vegetação que liga fragmentos de mata. Animais grandes, como antas e bugios, não atravessam campo aberto: o corredor é o caminho por onde chegam e trocam genes com outras populações.'],
    ['Mata ciliar', 'cil', () => 'A mata da beira dos rios. Segura o barranco, filtra a água e sombreia o rio. As espécies de lá, como o ingá, aguentam as cheias.'],
    ['Erosão', 'ero', () => 'A chuva arrastando a camada fértil do solo. Acontece quando o chão está descoberto, principalmente nas encostas. Plantas e folhas no chão seguram a terra.'],
    ['Área restaurada', 'res', () => `Quando uma área vira mata madura, você passa para a próxima. Tudo recomeça, mas a produção fica maior para sempre (+50% por área restaurada) e o diário é mantido.\n\nAgora: ${GS.restored} área(s) restaurada(s), produção ×${n2(prestigeMult())}.`],
    ['Jogo fechado', 'off', () => 'Com a página fechada, os animais continuam trabalhando pela metade do ritmo, por até 8 horas. Ao voltar, você recebe as sementes acumuladas.']
  ];
  function openGloss(key) { S.over = 'glos'; S.gsel = Math.max(0, GLOSS.findIndex(x => x[1] === key)); S.sc = {}; }
  function drawGloss() {
    R(g, 0, 12, VW, 228, '#e8e0c8'); R(g, 0, 12, VW, 12, '#2a5a2a'); text(g, 'GLOSSÁRIO', 4, 12, P.py);

    S.msgs.filter(m => S.t - m.at < 6).slice(0, 2).forEach((m, i) => { const ls = wrap(m.t, 52).slice(0, 2); R(g, 0, 14 + i * 22, VW, ls.length * 10 + 1, 'rgba(0,0,0,.6)'); ls.forEach((l, j) => text(g, l, 3, 13 + i * 22 + j * 10, m.c)); });
  }
  function drawTitle() {
    R(g, 0, 0, VW, VH, '#3cbcfc'); R(g, 0, 90, VW, 60, '#a4e4fc');
    ridge(g, 0, 0, [[0, 150], [80, 120], [160, 140], [240, 112], [320, 136]], '#4a7a8a', 240, VW);
    ridge(g, 0, 0, [[0, 176], [100, 164], [200, 178], [320, 160]], '#2a6a3a', 240, VW);

    textC(g, 'REGEN', 160, 26, P.dg, 5);

    if (Math.floor(S.t * 2) % 2) textC(g, 'CLIQUE PARA PLANTAR', 160, 220, P.w);
  }

  // ---------------- laço ----------------
  let last = performance.now(), saveT = 0;
  function frame(now) {
    const dt = Math.min(.25, (now - last) / 1000); last = now; S.t += dt;
    HITS = []; AREAS = [];
    try {
      if (S.scene === 'title') drawTitle();
      else {
        if (!S.modal) { tick(dt); saveT += dt; if (saveT > 5) { saveT = 0; save(); } }
        drawGame();
      }
      if (S.modal) {
        HITS = []; DRAWING_MODAL = true;
        for (let y = 0; y < VH; y++) for (let x = (y % 2); x < VW; x += 2) if ((x + y) % 4 === 0) R(g, x, y, 1, 1, P.k);
        const ls = wrap(S.modal.text, 40), h = ls.length * LH + 34, y0 = Math.round(120 - h / 2);
        R(g, 34, y0, 252, h, P.k); R(g, 35, y0 + 1, 250, h - 2, '#e8f0e0'); R(g, 35, y0 + 1, 250, 3, P.dg);
        ls.forEach((l, i) => text(g, l, 40, y0 + 7 + i * LH, P.k));
        const bw = 80, n = S.modal.btns.length, bx = 160 - (n * bw + (n - 1) * 8) / 2;
        S.modal.btns.forEach(([l, fn], i) => btn(bx + i * (bw + 8), y0 + h - 20, bw, 14, l, fn, i === 0 ? { bg: P.y } : {}));
        DRAWING_MODAL = false;

    if (M.x >= 0 && M.y >= 0 && M.x < VW && M.y < VH && matchMedia('(pointer:fine)').matches) {
      const cx = Math.round(M.x), cy = Math.round(M.y);
      ['k.........', 'kk........', 'kwk.......', 'kwwk......', 'kwwwk.....', 'kwwwwk....', 'kwwwwwk...', 'kwwwkkkk..', 'kwkwk.....', 'kk.kwk....', 'k...kk....'].forEach((row, j) => { for (let i = 0; i < 10; i++) if (row[i] !== '.') R(g, cx + i, cy + j, 1, 1, row[i] === 'k' ? P.k : P.w); });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  function fit() {
    const W = window.innerWidth, H = window.innerHeight;
    document.getElementById('mon').style.width = Math.max(280, Math.floor(Math.min(W - 12, (H - 60) / 0.775, 1100))) + 'px';
  }
  window.addEventListener('resize', fit); fit();
  window.__R = { exportCycle: () => MUS.exportCycle(), get G() { return GS; }, set G(v) { GS = v; }, get S() { return S; }, tick, rates, buyPlant, buyFa, buyUp, cutEuc, restore, reqs, cover, luz, shannon, fauna, clickPow, survival, fresh, PL, FA, UP, PL_ORDER, FA_ORDER, UP_ORDER, costOf, click, clk() { M.x = 100; M.y = 60; clickScene(); } };


})();
